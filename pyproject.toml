[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-harbor"
version = "0.1.0"
description = "Local image organization and management software."
requires-python = "==3.13.12"
dependencies = [
	"alembic>=1.16,<2.0",
	"platformdirs>=4.3,<5.0",
	"sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
	"black>=24.0,<25.0",
	"pytest>=8.0,<9.0",
	"pre-commit>=4.0,<5.0",
	"ruff>=0.11,<0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
